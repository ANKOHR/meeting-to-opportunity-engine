[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-to-opportunity-engine"
version = "0.1.0"
description = "Deterministic next actions from explicit call-note facts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mtoe = "meeting_to_opportunity_engine.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_to_opportunity_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
